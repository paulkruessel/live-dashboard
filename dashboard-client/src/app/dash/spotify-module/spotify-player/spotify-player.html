<p-card [style]="{ width: '25rem', overflow: 'hidden', padding: '0' }">
<div class="relative group overflow-hidden rounded-[inherit]">
            <!-- Cover -->
            <img
                alt="Card"
                class="block w-full h-full object-cover rounded-2xl"
                [src]="songCover()?.getUrl()"
            />

            <!-- Overlay -->
            <div
                class="
                    absolute inset-0
                    flex flex-col
                    items-center justify-center
                    bg-black/50
                    opacity-0
                    group-hover:opacity-100
                    transition-opacity duration-300
                    p-20
                    rounded-2xl
                "
            >
                <!-- Song info -->
                <div class="text-center text-white mb-4">
                    <div class="text-xl font-semibold">
                        {{ songTitle() }}
                    </div>

                    <div class="text-sm opacity-80">
                        {{ songArtist() }}
                    </div>
                </div>

                <!-- Slider -->
                
                <p-slider [(ngModel)]="value" class="w-full mb-4" [max]="songLengthMs()" [animate]="true" />

                <!-- Controls -->
                <div class="flex gap-4">
                    <p-button
                        icon="pi pi-step-backward"
                        severity="secondary"
                        [outlined]="true"
                        (onClick)="previousSong()"
                    />

                    <p-button
                        [icon]="isPlaying() ? 'pi pi-pause' : 'pi pi-play'"
                        (onClick)="pausePlay()"
                    />

                    <p-button
                        icon="pi pi-step-forward"
                        severity="secondary"
                        [outlined]="true"
                        (onClick)="skipSong()"
                    />
                </div>
            </div>
        </div>
</p-card>
